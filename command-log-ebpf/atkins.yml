version: "3"

vars:
  BINARY: bin/command-log-ebpf-linux-amd64
  CLI_ARGS: ''

tasks:
  default:
    desc: Build and run the tracer
    interactive: true
    cmds:
      - atkins go:build
      - rm execution.log.yml -f
      - ${{BINARY}} ${{CLI_ARGS}} | tee -a execution.log.yml

  build:
    desc: Build the binary
    cmds:
      - atkins go:generate
      - atkins go:build

  generate:
    desc: Run go generate (compile eBPF program)
    cmds:
      - atkins go:generate

  test:
    desc: Run tests
    cmds:
      - atkins go:test
      - go run scripts/sankey.go && plantuml -tsvg execution-sankey.puml

  lint:
    desc: Lint the code
    cmds:
      - atkins go:lint

  fmt:
    desc: Format the code
    cmds:
      - atkins go:fmt

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin/
